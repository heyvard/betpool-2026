name: Bygg, test og deploy til Vercel
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
on:
  push:

jobs:
  lint-test:
    name: Lint, test og Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Eslint
        run: pnpm lint
      - name: Enhetstester
        run: pnpm test:ci
      - name: Prettier
        run: pnpm prettier:check

  deploy-prod-database:
    needs: lint-test
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    concurrency: deploy-prod
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Kjør databasemigrasjoner
        run: pnpm migrate
        env:
          PG_URI: ${{ secrets.PG_URI }}
