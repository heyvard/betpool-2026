name: Bygg, test og deploy til Vercel
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
on:
  push:

jobs:
  lint-test:
    name: Lint, test og Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Eslint
        run: pnpm lint
      - name: Enhetstester
        run: pnpm test:ci
      - name: Prettier
        run: pnpm prettier:check

  integration-test:
    name: API-integrasjon og e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Installer Playwright-nettleser
        run: pnpm exec playwright install --with-deps chromium
      - name: API-integrasjonstester
        run: pnpm test:integration
      - name: E2E-tester
        run: pnpm test:e2e

  deploy:
    name: Trigg Vercel-deploy produksjon
    needs: [lint-test, integration-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Kall Vercel Deploy Hook
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
