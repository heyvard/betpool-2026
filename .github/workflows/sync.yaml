name: Synk kamper og resultater

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    name: POST /api/cron/sync
    runs-on: ubuntu-latest
    steps:
      - name: Synk kamper og resultater
        run: |
          curl -fsS -X POST "${{ secrets.APP_BASE_URL }}/api/cron/sync" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
